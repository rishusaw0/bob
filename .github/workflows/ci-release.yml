name: JEEVA AI CI & Windows Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  test-and-verify:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run full verification suite
        run: npm test

      - name: Build production bundle
        run: npm run build

      - name: Build Windows NSIS Setup (.exe)
        run: npx electron-builder --win nsis --publish never

      - name: Upload Windows Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: jeeva-ai-windows-installer
          path: |
            release/*.exe
            release/*.blockmap

  release-windows-installer:
    needs: test-and-verify
    if: startsWith(github.ref, 'refs/tags/v') || (github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[publish-release]'))
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
      - name: Resolve release tag
        id: release-meta
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $tag = $env:GITHUB_REF_NAME
          } else {
            $version = node -p "require('./package.json').version"
            $tag = "v$version"
          }
          "tag_name=$tag" >> $env:GITHUB_OUTPUT

        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build

      - name: Build Windows NSIS Setup (.exe)
        run: npx electron-builder --win nsis --publish never

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release-meta.outputs.tag_name }}
          target_commitish: ${{ github.sha }}
          files: |
            release/*.exe
            release/*.blockmap
          generate_release_notes: true
