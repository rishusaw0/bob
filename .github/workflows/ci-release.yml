name: JEEVA AI CI & Windows Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-verify:
    runs-on: windows-latest
    outputs:
      lockfile_artifact: ${{ steps.upload-lockfile.outcome == 'success' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Refresh lockfile for patched dependency versions
        run: npm install --package-lock-only --ignore-scripts

      - name: Install dependencies
        run: npm ci

      - name: Upload regenerated dependency lockfile
        id: upload-lockfile
        uses: actions/upload-artifact@v4
        with:
          name: jeeva-patched-package-lock
          path: package-lock.json
          if-no-files-found: error

      - name: Print dependency audit details
        if: always()
        shell: pwsh
        run: |
          npm audit --json > npm-audit.json
          $auditExit = $LASTEXITCODE
          node -e "const a=require('./npm-audit.json'); console.log(JSON.stringify({metadata:a.metadata?.vulnerabilities, vulnerabilities:Object.entries(a.vulnerabilities||{}).map(([name,v])=>({name,severity:v.severity,range:v.range,fixAvailable:v.fixAvailable,via:v.via.map(x=>typeof x==='string'?x:{title:x.title,url:x.url,range:x.range})}))},null,2))"
          if ($auditExit -ne 0) { exit $auditExit }

      - name: Run full verification suite
        run: npm test

      - name: Run Phase 5 reliability matrix
        run: npm run test:phase5

      - name: Run security regression tests
        run: npm run test:security

      - name: Build production bundle
        run: npm run build

      - name: Build Windows NSIS Setup (.exe)
        run: npx electron-builder --win nsis --publish never

      - name: Upload Windows Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: jeeva-ai-windows-installer
          path: |
            release/*.exe
            release/*.blockmap
          if-no-files-found: error


  sync-patched-lockfile:
    needs: test-and-verify
    if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && needs.test-and-verify.outputs.lockfile_artifact == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Download regenerated lockfile
        uses: actions/download-artifact@v4
        with:
          name: jeeva-patched-package-lock
          path: .

      - name: Commit lockfile update to pull request branch
        env:
          BRANCH_NAME: ${{ github.head_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then echo "Lockfile already up to date."; exit 0; fi
          git commit -m "chore(deps): refresh patched package lockfile"
          git push origin "HEAD:$BRANCH_NAME"

  release-windows-installer:
    needs: test-and-verify
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Resolve release tag
        id: release-meta
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $tag = $env:GITHUB_REF_NAME
          } else {
            $version = node -p "require('./package.json').version"
            $tag = "v$version"
          }
          "tag_name=$tag" >> $env:GITHUB_OUTPUT

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build

      - name: Build Windows NSIS Setup (.exe)
        run: npx electron-builder --win nsis --publish never

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release-meta.outputs.tag_name }}
          target_commitish: ${{ github.sha }}
          files: |
            release/*.exe
            release/*.blockmap
          generate_release_notes: true
