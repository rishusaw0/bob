<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="12" y1="8" x2="116" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="55%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#05070b"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="16" y1="16" x2="112" y2="112" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="coreGrad" x1="36" y1="26" x2="94" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6ee7b7"/>
      <stop offset="55%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>

  <!-- Obsidian Squircle Base -->
  <rect x="4" y="4" width="120" height="120" rx="30" fill="url(#bgGrad)"/>
  <rect x="5.5" y="5.5" width="117" height="117" rx="28.5" stroke="url(#ringGrad)" stroke-opacity="0.55" stroke-width="3"/>

  <!-- Subtle Outer Neural Halo -->
  <circle cx="64" cy="64" r="40" stroke="url(#ringGrad)" stroke-opacity="0.22" stroke-width="2" stroke-dasharray="6 6"/>

  <!-- Modern Geometric J + Voice Core -->
  <path
    d="M74 34V72C74 84.15 64.15 94 52 94C42.8 94 35.1 88.35 32 80.2"
    stroke="url(#coreGrad)"
    stroke-width="11"
    stroke-linecap="round"
  />

  <!-- Top Neural Spark Node -->
  <circle cx="74" cy="34" r="6.5" fill="#6ee7b7"/>

  <!-- Voice Wave Bars (Left Accent) -->
  <rect x="34" y="46" width="6" height="18" rx="3" fill="#38bdf8" fill-opacity="0.9"/>
  <rect x="46" y="38" width="6" height="28" rx="3" fill="#34d399"/>
  <rect x="88" y="50" width="6" height="20" rx="3" fill="#a78bfa" fill-opacity="0.9"/>
</svg>
